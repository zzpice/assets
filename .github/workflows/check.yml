name: Check and deploy image library

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/update_catalog.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --check app/catalog.js
      - run: node --check app/site.js && node --check app/actresses.js && node --check sw.js
      - run: node --test scripts/test_*.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Assemble public site
        run: |
          mkdir -p build/pages
          cp -R index.html catalog.json sw.js .nojekyll app wallpapers avatars icons bank-cards game-covers actresses build/pages/
      - run: SITE_ROOT=build/pages node scripts/browser-check.cjs
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v5
