name: Check gallery

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/update_catalog.py --check
      - run: node --check app/site.js && node --check app/actresses.js && node --check sw.js
      - run: node --test scripts/test_*.cjs
