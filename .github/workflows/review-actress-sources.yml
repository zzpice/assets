name: Review actress sources

on:
  workflow_dispatch:
    inputs:
      year:
        description: Optional completed annual year (2023 onward)
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/actress_sources.py duplicates --output ../actress-review
      - run: python scripts/actress_sources.py portraits --output ../actress-review
      - name: Fetch optional completed annual ranking
        if: inputs.year != ''
        env:
          REVIEW_YEAR: ${{ inputs.year }}
        run: python scripts/actress_sources.py annual --year "$REVIEW_YEAR" --output ../actress-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: actress-source-review
          path: ../actress-review/
          retention-days: 14
          if-no-files-found: error
