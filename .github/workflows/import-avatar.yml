name: Import avatar once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-avatar.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download avatar
        run: |
          curl -L --fail --retry 3             "https://img.seedvault.cn/i/2026/10/04/avatar6ac1bda6c327c308.png"             -o avatar.png
          test -s avatar.png

      - name: Commit avatar and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatar.png
          git rm .github/workflows/import-avatar.yml
          git commit -m "chore: host avatar in repository"
          git push
